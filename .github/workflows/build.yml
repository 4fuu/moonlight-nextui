name: Build Moonlight.pakz

# The host orb has no Docker, so this workflow is the authoritative aarch64
# build: it cross-compiles the Apostrophe wrapper and the vendored NextUI
# overlay renderer inside the NextUI toolchain image, then packages the pak
# with the bundled spruce engine (2.7.0 on main; the v2.7.1 experiment branch
# rebuilds the engine with engine/Dockerfile and commits the result).
#
# host-checks runs the same host build and tests a developer runs locally
# (scripts/nextui/build.sh host, ctest), plus shellcheck and manifest checks.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: moonlight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Bounded experiment: build the upstream v2.7.1 engine with the spruce
  # toolchain and upload it. The pak job still packages the committed
  # engine/bin, so a failed or unreviewed experiment cannot change main.
  engine-build:
    name: Build engine v2.7.1 (experiment)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.ref, 'engine-v271-experiment') ||
      contains(github.head_ref, 'engine-v271-experiment')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build the engine in the spruce container
        run: |
          set -e
          docker build -t moonlight-engine-v271 engine
          mkdir -p engine-out
          docker run --rm -v "$PWD/engine-out:/output" moonlight-engine-v271

      - name: Inspect the engine artifact
        run: |
          set -e
          file engine-out/moonlight
          file engine-out/moonlight | grep -q 'ARM aarch64'
          test -x engine-out/moonlight
          echo "shared libraries: $(find engine-out/libs -maxdepth 1 -name '*.so*' | wc -l)"
          ls engine-out/libs

      - name: Upload the engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-v2.7.1
          path: engine-out
          if-no-files-found: error

  host-checks:
    name: Host build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config shellcheck zip python3 \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsamplerate0-dev

      - name: Configure and build
        run: ./scripts/nextui/build.sh host

      - name: Run tests
        run: ctest --test-dir build-host --output-on-failure

      - name: Validate scripts
        run: |
          shellcheck -s sh \
            Tools/tg5040/Moonlight.pak/launch.sh \
            shim/moonlight \
            scripts/nextui/*.sh
          python3 -m py_compile scripts/nextui/check-libs.py
          sh -n Tools/tg5040/Moonlight.pak/launch.sh
          sh -n shim/moonlight

      # The manifest is checked twice: tests/test_pak_manifest.c uses NextUI's
      # own parser (what the launcher reads), and the Pak Store fields below are
      # the ones only this repository's packaging depends on.
      - name: Validate manifests
        run: |
          python3 -m json.tool Tools/tg5040/Moonlight.pak/pak.json >/dev/null
          python3 - <<'PY'
          import json
          manifest = json.load(open("Tools/tg5040/Moonlight.pak/pak.json"))
          for key in ("id", "name", "version", "type", "repo_url", "release_filename", "platforms"):
              assert key in manifest, f"pak.json missing {key}"
          assert manifest["type"] == "TOOL", manifest["type"]
          assert manifest["release_filename"] == "Moonlight.pakz"
          assert manifest["platforms"] == ["tg5040"], manifest["platforms"]
          # Dynamic ownership (contract 7.9) requires the static permission.
          assert manifest.get("capabilities") == ["overlay"], manifest.get("capabilities")
          print("pak.json store fields ok:", manifest["id"], manifest["version"])
          PY

      - name: Upload renders
        uses: actions/upload-artifact@v4
        with:
          name: overlay-render
          path: |
            build-host/overlay-smoke.png
            build-host/hud-smoke.png
          if-no-files-found: warn

  tg5040:
    name: Cross-build Moonlight.pakz
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/loveretro/tg5040-toolchain:latest
    env:
      JOBS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install packaging tools
        run: |
          set -e
          for attempt in 1 2 3; do
            if apt-get update &&
               apt-get install -y --no-install-recommends \
                 zip file python3 ca-certificates; then
              break
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 15
          done
          command -v zip file python3

      - name: Show toolchain
        run: |
          echo "CROSS_TRIPLE=$CROSS_TRIPLE"
          echo "SYSROOT=$SYSROOT"
          ${CROSS_TRIPLE}-gcc --version | head -1
          cmake --version | head -1
          pkg-config --modversion sdl2
          # SDL2_ttf/SDL2_image ship as .so stubs without .pc files.
          ls "${SYSROOT}"/usr/lib/libSDL2_ttf.so "${SYSROOT}"/usr/lib/libSDL2_image.so
          ls "${SYSROOT}"/usr/lib/libsamplerate.so*

      - name: Cross-build wrapper and overlay
        run: ./scripts/nextui/build.sh tg5040

      # The pak build compiles the overlay archive but does not link it into a
      # binary (M2 does that). Linking it here proves the aarch64 closure
      # resolves -- SDL2_ttf/SDL2_image stubs, libsamplerate, and the platform
      # seam -- which a compile-only build cannot show.
      - name: Link the overlay into an aarch64 binary
        run: |
          set -e
          cmake -S . -B build-link \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-tg5040.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOONLIGHT_PLATFORM=tg5040 \
            -DNEXTUI_BUILD_TESTS=ON
          cmake --build build-link --target overlay-smoke --parallel "${JOBS}"
          ${CROSS_TRIPLE}-readelf -h build-link/overlay-smoke | grep -q 'AArch64'
          echo "overlay link closure: $(ls -l build-link/overlay-smoke | awk '{print $5}') bytes"
          ${CROSS_TRIPLE}-readelf -d build-link/overlay-smoke | grep NEEDED

      - name: Package Moonlight.pakz
        run: ./scripts/nextui/make-pak.sh

      - name: Check the engine library closure
        run: |
          READELF="${CROSS_TRIPLE}-readelf" \
            python3 scripts/nextui/check-libs.py dist/Moonlight.pak \
              --sysroot "$SYSROOT"

      - name: Fetch qemu-user and the device glibc
        run: |
          set -e
          python3 - <<'PY'
          import os, urllib.request

          temp = os.environ["RUNNER_TEMP"]
          files = {
              "qemu-aarch64-static.tar.gz":
                  "https://github.com/multiarch/qemu-user-static/releases/"
                  "download/v7.2.0-1/qemu-aarch64-static.tar.gz",
              "libc6.deb":
                  "https://ports.ubuntu.com/ubuntu-ports/pool/main/g/glibc/"
                  "libc6_2.31-0ubuntu9_arm64.deb",
          }
          for name, url in files.items():
              request = urllib.request.Request(
                  url, headers={"User-Agent": "moonlight-nextui-ci"})
              with urllib.request.urlopen(request) as response, \
                      open(os.path.join(temp, name), "wb") as output:
                  output.write(response.read())
          PY
          cd "$RUNNER_TEMP"
          sha256sum -c - <<'SUMS'
          b5dd968d522fd5d615d27c77fb1ca0847455d0b8badd7492647e7ab674339247  qemu-aarch64-static.tar.gz
          783130400addeedde4c32e020d8e6bb612d9c8296eea66c74f2f86cbc938c033  libc6.deb
          SUMS
          tar -xzf qemu-aarch64-static.tar.gz
          chmod +x qemu-aarch64-static
          # The toolchain sysroot's glibc predates GLIBC_2.29, which the engine
          # needs. Use the focal glibc the engine is built against as the
          # loader root and take the rest of the runtime from the sysroot.
          rm -rf glibcroot
          mkdir -p glibcroot
          dpkg-deb -x libc6.deb glibcroot
          mv glibcroot/lib/aarch64-linux-gnu/* glibcroot/lib/
          rmdir glibcroot/lib/aarch64-linux-gnu
          ln -sf ld-2.31.so glibcroot/lib/ld-linux-aarch64.so.1

      - name: Dry-run the engine through qemu-user
        run: |
          set -e
          PAK=dist/Moonlight.pak
          GLIBC="$RUNNER_TEMP/glibcroot"
          set +e
          out=$(QEMU_LD_PREFIX="$GLIBC" \
                LD_LIBRARY_PATH="$PAK/bin/libs:$GLIBC/lib:$SYSROOT/usr/lib:$SYSROOT/lib:$SYSROOT/usr/lib/aarch64-linux-gnu:$SYSROOT/lib/aarch64-linux-gnu" \
                SDL_VIDEODRIVER=dummy \
                "$RUNNER_TEMP/qemu-aarch64-static" "$PAK/bin/moonlight" --version 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 0
          echo "$out" | grep -q '2\.7\.'

      - name: Verify pak layout
        run: |
          set -e
          PAK=dist/Moonlight.pak
          test -x "$PAK/launch.sh"
          test -x "$PAK/shim/moonlight"
          test -x "$PAK/bin/moonlight"
          test -x "$PAK/moonlight-pak"
          test -f "$PAK/pak.json"
          test -d "$PAK/bin/libs"
          ${CROSS_TRIPLE}-readelf -h "$PAK/moonlight-pak" | grep -q 'AArch64'
          ${CROSS_TRIPLE}-readelf -h "$PAK/bin/moonlight" | grep -q 'AArch64'
          # The archive root must be the pak (launch.sh at the root).
          unzip -l dist/Moonlight.pakz | grep -q ' launch.sh$'
          echo "bundled engine libs: $(ls "$PAK/bin/libs" | wc -l)"
          du -sh "$PAK" dist/Moonlight.pakz

      - name: Build summary
        run: |
          {
            echo "### Moonlight tg5040 build"
            echo
            echo "- wrapper: $(ls -lh build-nextui/moonlight-pak | awk '{print $5}')"
            echo "- engine: $(ls -lh engine/bin/moonlight | awk '{print $5}')"
            echo "- bundled engine libs: $(ls engine/bin/libs | wc -l)"
            echo "- pakz size: $(du -h dist/Moonlight.pakz | cut -f1)"
            echo
            echo "Bundled libraries:"
            echo '```'
            ls dist/Moonlight.pak/bin/libs
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pakz
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-tg5040-pakz
          path: dist/Moonlight.pakz
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tg5040-build-logs
          path: |
            build-nextui/CMakeCache.txt
            build-nextui/CMakeFiles/CMakeError.log
            build-nextui/CMakeFiles/CMakeOutput.log
            build-link/CMakeCache.txt
          if-no-files-found: ignore
